net route-domain /Common/rd1 {
    id 1
    vlans {
        /Common/v_seg1
    }
}
net route-domain /Common/rd2 {
    id 2
    vlans {
        /Common/v_seg2
    }
}
net vlan /Common/v_seg1 {
    tag 10
    interfaces {
        1.1 { }
    }
}
net vlan /Common/v_seg2 {
    tag 20
    interfaces {
        1.2 { }
    }
}
net self /Common/self_seg1 {
    address 10.210.240.201%1/16
    vlan /Common/v_seg1
    allow-service default
}
net self /Common/self_seg2 {
    address 172.31.1.201%2/24
    vlan /Common/v_seg2
    allow-service default
}
net route /Common/default_rd1 {
    gw 10.210.1.1%1
    network default%1
}
net route /Common/default_rd2 {
    gw 172.31.1.158%2
    network default%2
}
ltm node /Common/n_seg1 {
    address 10.210.240.158%1
}
ltm node /Common/n_seg2 {
    address 172.31.1.158%2
}
ltm pool /Common/p_seg1 {
    members {
        /Common/n_seg1:8080 {
            address 10.210.240.158%1
        }
    }
    monitor /Common/tcp
}
ltm pool /Common/p_seg2 {
    members {
        /Common/n_seg2:8080 {
            address 172.31.1.158%2
        }
    }
    monitor /Common/tcp
}
ltm virtual /Common/vs_seg1 {
    destination /Common/10.210.240.211%1:80
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/p_seg1
    profiles {
        /Common/tcp { }
    }
    source 0.0.0.0%1/0
    translate-address enabled
    translate-port enabled
}
ltm virtual /Common/vs_seg2 {
    destination /Common/172.31.1.211%2:80
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/p_seg2
    profiles {
        /Common/tcp { }
    }
    source 0.0.0.0%2/0
    translate-address enabled
    translate-port enabled
}
