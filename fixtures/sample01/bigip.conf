ltm node /Common/web01 {
    address 10.10.20.11
    description web01
}
ltm node /Common/web02 {
    address 10.10.20.12
    description web02
}
ltm node /Common/app01 {
    address 10.10.30.21
    description app01
    session user-disabled
}
ltm monitor http /Common/http_basic {
    defaults-from http
    destination *:*
    interval 5
    recv "200 OK"
    send "GET /health HTTP/1.1\r\nHost: example.com\r\n\r\n"
    time-until-up 0
    timeout 16
}
ltm monitor tcp /Common/tcp_8080 {
    defaults-from tcp
    destination *:8080
    interval 5
    timeout 16
}
ltm pool /Common/web_pool {
    load-balancing-mode least-connections-member
    members {
        /Common/web01:80 {
            address 10.10.20.11
        }
        /Common/web02:80 {
            address 10.10.20.12
        }
    }
    monitor /Common/http_basic
}
ltm pool /Common/app_pool {
    load-balancing-mode round-robin
    members {
        /Common/app01:8080 {
            address 10.10.30.21
        }
    }
    monitor /Common/tcp_8080
}
ltm persistence source-addr /Common/src_persist {
    defaults-from source_addr
    timeout 1800
}
ltm persistence cookie /Common/cookie_persist {
    defaults-from cookie
    cookie-name BIGipServer
    method insert
}
ltm profile http /Common/http_xff {
    defaults-from http
    insert-xforwarded-for enabled
}
ltm virtual /Common/vs_web_http {
    destination /Common/10.10.10.100:80
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/web_pool
    persist {
        /Common/src_persist {
            default yes
        }
    }
    profiles {
        /Common/http_xff { }
        /Common/tcp { }
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
ltm virtual /Common/vs_app {
    destination /Common/10.10.10.101:8080
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/app_pool
    profiles {
        /Common/tcp { }
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
