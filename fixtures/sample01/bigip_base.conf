net vlan /Common/external {
    tag 10
    interfaces {
        1.1 { }
    }
}
net vlan /Common/internal {
    tag 20
    interfaces {
        1.2 { }
    }
}
net self /Common/self_ext_local {
    address 10.10.10.5/24
    traffic-group /Common/traffic-group-local-only
    vlan /Common/external
    allow-service default
}
net self /Common/self_ext_float {
    address 10.10.10.4/24
    traffic-group /Common/traffic-group-1
    vlan /Common/external
    allow-service default
}
net self /Common/self_int_local {
    address 10.10.20.5/24
    traffic-group /Common/traffic-group-local-only
    vlan /Common/internal
    allow-service default
}
net self /Common/self_int_float {
    address 10.10.20.4/24
    traffic-group /Common/traffic-group-1
    vlan /Common/internal
    allow-service default
}
net route /Common/default_route {
    gw 10.10.10.1
    network default
}
net route /Common/net30 {
    gw 10.10.20.1
    network 10.10.30.0/24
}
sys ntp {
    servers { 10.0.0.10 10.0.0.11 }
    timezone America/New_York
}
sys snmp {
    communities {
        /Common/comm-public {
            community-name public
            source default
        }
    }
    v1-and-v2c-access read-only
}
sys syslog {
    remote-servers {
        /Common/syslog1 {
            host 10.0.0.20
            remote-port 514
        }
    }
}
sys management-ip 192.168.1.50/24 { }
sys management-route /Common/default {
    gateway 192.168.1.1
    network default
}
