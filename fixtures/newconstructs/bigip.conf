ltm node /Common/nc_srv1 {
    address 192.0.2.11
    ratio 5
}
ltm node /Common/nc_srv2 {
    address 192.0.2.12
    state user-down
}
ltm node /Common/nc_srv3 {
    address 192.0.2.13
    session user-disabled
    connection-limit 1000
}
ltm node /Common/nc_srv4 {
    address 192.0.2.14
    monitor min 1 of { /Common/gateway_icmp /Common/tcp }
}
ltm monitor http /Common/nc_http_mon {
    defaults-from /Common/http
    destination *:*
    interval 5
    recv "200 OK"
    send "GET /health HTTP/1.1\r\nHost: nc.example.com\r\nConnection: Close\r\n\r\n"
    time-until-up 0
    timeout 16
}
ltm pool /Common/nc_pool_web {
    load-balancing-mode ratio-member
    members {
        /Common/nc_srv1:80 {
            address 192.0.2.11
            ratio 3
        }
        /Common/nc_srv2:80 {
            address 192.0.2.12
            monitor /Common/nc_http_mon
        }
    }
    monitor /Common/gateway_icmp
}
ltm pool /Common/nc_pool_app {
    members {
        /Common/nc_srv3:8080 {
            address 192.0.2.13
            connection-limit 500
        }
        /Common/nc_srv4:8080 {
            address 192.0.2.14
        }
    }
    monitor min 1 of { /Common/nc_http_mon /Common/tcp_half_open }
}
ltm pool /Common/nc_pool_head {
    members {
        /Common/nc_srv1:443 {
            address 192.0.2.11
        }
    }
    monitor /Common/https_443
}
ltm virtual /Common/nc_vs_web {
    destination /Common/198.51.100.10:80
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/nc_pool_web
    profiles {
        /Common/f5-tcp-lan { }
        /Common/http { }
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
ltm virtual /Common/nc_vs_app {
    destination /Common/198.51.100.11:8080
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/nc_pool_app
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
ltm virtual /Common/nc_vs_head {
    destination /Common/198.51.100.12:443
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/nc_pool_head
    profiles {
        /Common/serverssl-insecure-compatible {
            context serverside
        }
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
